# cargo-deny - license + advisory + bans audit.

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    # quick-xml < 0.41 (quadratic attribute check, unbounded namespace
    # allocation): only reached through wayland-scanner, a proc-macro that
    # parses the Wayland protocol XML shipped inside the wayland crates at
    # compile time. No untrusted XML is ever parsed at run time, and no
    # semver-compatible wayland-scanner with quick-xml 0.41 exists yet.
    { id = "RUSTSEC-2026-0194", reason = "build-time only: wayland-scanner parses bundled protocol XML" },
    { id = "RUSTSEC-2026-0195", reason = "build-time only: wayland-scanner parses bundled protocol XML" },
    # ttf-parser is unmaintained with no successor yet; epaint (egui) uses
    # it to read the fonts compiled into the binary, never user files.
    { id = "RUSTSEC-2026-0192", reason = "egui reads only its bundled fonts; no replacement available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "LGPL-3.0",
    "LGPL-2.1",
    # Permissive font licenses pulled in by egui's default fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Workspace path-deps look like wildcards to cargo-deny; warn rather
# than deny so the workspace structure isn't penalised.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
