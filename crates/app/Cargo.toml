[package]
name = "f9-talk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "F9 Talk: hold-to-talk dictation."
repository = "https://github.com/moamen1358/f9-talk"

[[bin]]
name = "f9-talk"
path = "src/main.rs"

[features]
default = []
ydotool-fallback = ["f9-talk-input/ydotool-fallback"]

[dependencies]
f9-talk-core = { path = "../core" }
f9-talk-input = { path = "../input" }
f9-talk-audio = { path = "../audio" }
f9-talk-stt = { path = "../stt" }
f9-talk-ui = { path = "../ui" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
libc = "0.2"
eframe = { workspace = true, features = ["x11"] }

[package.metadata.deb]
name = "f9-talk"
maintainer = "Moamen Ghareeb <moamen.ghareeb.11@gmail.com>"
copyright = "2026, Moamen Ghareeb <moamen.ghareeb.11@gmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """Hold F9 to dictate; text appears at your cursor.
Cloud STT via Deepgram Nova-3 streaming. Audio-reactive overlay
indicator (a native wlr-layer-shell wave on Wayland). Linux X11 +
Wayland."""
section = "utils"
priority = "optional"
# Replaces / Conflicts on the Python f9-talk so `dpkg -i` cleanly
# removes /opt/f9-talk before laying down the Rust binary.
conflicts = "f9-talk (<= 0.3.99)"
replaces = "f9-talk (<= 0.3.99)"
# `$auto` resolves the shared-library deps from the binary. The two
# runtime tools (wl-clipboard for the layout-independent paste path on
# Wayland, wtype as the per-key fallback) are separate executables, so
# they're listed explicitly — installing the .deb pulls them in too.
depends = "$auto, libc6, libxkbcommon0, libxcb1, libxcb-render0, libxcb-shape0, libxcb-xfixes0, libasound2, libdbus-1-3, wl-clipboard, wtype"
# X11 sessions only — the typer's xdotool fallback.
recommends = "xdotool"
maintainer-scripts = "../../packaging/debian"
assets = [
    # Binary
    ["target/release/f9-talk", "usr/bin/", "755"],
    # Menu entry + autostart
    ["../../packaging/debian/applications/f9-talk.desktop", "usr/share/applications/", "644"],
    ["../../packaging/debian/autostart/f9-talk.desktop", "etc/xdg/autostart/", "644"],
    # Icons (top-level assets/ dir)
    ["../../assets/f9-talk.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/f9-talk.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # Udev rule for /dev/uinput
    ["../../packaging/debian/udev/99-f9-talk.rules", "etc/udev/rules.d/", "644"],
    # README / changelog as docs
    ["../../README.md", "usr/share/doc/f9-talk/", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/f9-talk/CHANGELOG.md", "644"],
    ["../../LICENSE", "usr/share/doc/f9-talk/LICENSE", "644"],
]
